<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin for cash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@600;700&display=swap">
<style>
:root{--bg:#fbeef0;--ink:#3b2150;--soft:#7a5c8a;--gold:#c9788a;--btn:#3b2150;--btnink:#fbeef0;--tx:#3b2150;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1230;--ink:#f8e7ee;--soft:#c3a6d3;--gold:#f0a8bd;--btn:#f0a8bd;--btnink:#1d1230}}
:root[data-theme="dark"]{--bg:#1d1230;--ink:#f8e7ee;--soft:#c3a6d3;--gold:#f0a8bd;--btn:#f0a8bd;--btnink:#1d1230}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;font-weight:600;display:grid;place-items:center;text-align:center;overflow-x:hidden}
main{padding:1rem;width:100%;max-width:26rem}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.1;margin:0 0 .5rem}
.sub{margin:0 0 1rem;font-size:.9rem;color:var(--soft)}
.wheelwrap{position:relative;width:min(80vw,20rem);margin:0 auto 1rem}
svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 18px rgba(120,70,120,.28))}
#wheel{transition:transform 4.5s cubic-bezier(.12,.7,.1,1);transform-origin:50% 50%}
.pin{position:absolute;left:50%;top:-.6rem;transform:translateX(-50%);font-size:2rem;line-height:1;color:var(--gold)}
button{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:999px;padding:.6em 1.8em;background:var(--btn);color:var(--btnink);cursor:pointer}
#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4.2rem;height:4.2rem;padding:0;font-size:.95rem;border:3px solid #fff8fa;box-shadow:0 4px 12px rgba(60,30,80,.35)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#result{min-height:4.5rem;font-size:1.1rem;font-weight:700;margin:0 0 .6rem}
#result small{display:block;font-size:.85rem;font-weight:600;color:var(--soft);margin-top:.3rem}
@media (prefers-reduced-motion:reduce){#wheel{transition-duration:.2s}}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="wheelwrap">
    <div class="pin" aria-hidden="true">▼</div>
    <svg viewBox="0 0 200 200" role="img" aria-label="Wheel of money outcomes"><g id="wheel"></g></svg>
    <button id="spin">Spin</button>
  </div>
  <p id="result" aria-live="polite"></p>
</main>
<script>
// Edit these to make it yours.
const C={
  title:"When we meet, who will pay? 💸",
  sub:"One spin. Fully random. Totally fair.",
  slices:["I pay|2000","I pay|1000","You pay|Nahid 500","I pay|5000","I pay|800","I pay|3000"],
  rigged:2, // the slice it always lands on
  win:"You pay Nahid 500 tk",
  quips:["Totally random. The wheel is certified honest. 😇","Spun again. Same result. Funny how that works.","The wheel has spoken three times now. Respect the wheel."],
  done:"Deal locked. Send it over 💸",
  colors:["#f4b8c8","#fbd9a8","#f0a0b8","#c9b8ec","#b6e0d0","#a9c4ee"]
};
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
$("title").textContent=C.title;$("sub").textContent=C.sub;
const N=C.slices.length,A=360/N,wheel=$("wheel");
const pt=(deg,r)=>[100+r*Math.sin(deg*Math.PI/180),100-r*Math.cos(deg*Math.PI/180)];
C.slices.forEach((s,i)=>{
  const [x1,y1]=pt(i*A,96),[x2,y2]=pt((i+1)*A,96);
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d",`M100 100 L${x1} ${y1} A96 96 0 0 1 ${x2} ${y2} Z`);
  p.setAttribute("fill",C.colors[i%C.colors.length]);
  p.setAttribute("stroke","#fff8fa");p.setAttribute("stroke-width","2");
  wheel.appendChild(p);
  const mid=i*A+A/2,[tx,ty]=pt(mid,60);
  const t=document.createElementNS(NS,"text");
  t.setAttribute("x",tx);t.setAttribute("y",ty);
  t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","central");
  t.setAttribute("font-size","10.5");t.setAttribute("font-weight","700");t.setAttribute("fill","#3b2150");
  const ang=mid-90+(mid>180?180:0);
  t.setAttribute("transform",`rotate(${ang} ${tx} ${ty})`);
  s.split("|").forEach((line,k,arr)=>{const ts=document.createElementNS(NS,"tspan");ts.setAttribute("x",tx);ts.setAttribute("dy",k===0?(arr.length>1?"-0.6em":"0"):"1.2em");ts.textContent=line;t.appendChild(ts);});
  wheel.appendChild(t);
});
let rot=0,spins=0,landed=false,booked=false;
const btn=$("spin"),res=$("result");
function go(){
  booked=false;landed=false;btn.disabled=true;res.textContent="";btn.textContent="Spin";
  rot=Math.ceil(rot/360)*360+360*6+(360-(C.rigged*A+A/2));
  wheel.style.transform=`rotate(${rot}deg)`;
  const wait=matchMedia("(prefers-reduced-motion: reduce)").matches?250:4600;
  setTimeout(()=>{
    const q=C.quips[Math.min(spins,C.quips.length-1)];spins++;
    res.innerHTML=`🎉 ${C.win}<small>${q}</small>`;
    landed=true;btn.textContent="Deal";btn.disabled=false;
  },wait);
}
btn.addEventListener("click",()=>{
  if(landed&&!booked){booked=true;res.textContent=C.done;btn.textContent="Done";btn.disabled=true;return;}
  go();
});
</script>
</body>
</html>
